manifest:
  group-filter:
    - +babblesim
    # TF-M and friends, no CircuitPython board builds with them.
    - -tee
  projects:
    - name: nrf_hw_models
      url: https://github.com/tannewt/ext_nRF_hw_models
      revision: 41cb69cd08848cc31e91ed62d01d397511981919
      path: modules/bsim_hw_models/nrf_hw_models
    # Adaboot with the Tess layout and its RAM-load fixes, branch tess
    - name: mcuboot
      url: https://github.com/phyx-be/adaboot
      revision: 2b22fb4c09293b398cea8b0bb5041429ac2f7634
      path: bootloader/mcuboot
    # The Allwinner T113 SoC, the Tess board and their drivers (Phyx Tess)
    - name: tess-zephyr
      url: git@github.com:bertouttier/tess-zephyr.git
      revision: 2271cc04dc692b8e9d6d402a95026fd48af39272
      path: modules/tess-zephyr
    - name: zephyr
      url: https://github.com/adafruit/zephyr
      revision: 87f27e4e1ce528367de5936cd4ee9fa4c32d42a8
      clone-depth: 100
      import:
        # Skip what no CircuitPython board can use, so west update fetches about
        # half of the projects. Boards come from adafruit, nordic, nxp,
        # raspberrypi, renesas, silabs, st and wch; the Pico W's CYW43 is in hal_infineon.
        name-blocklist:
          # HALs of vendors without a board here
          - hal_adi
          - hal_afbr
          - hal_ambiq
          - hal_atmel
          - hal_bouffalolab
          - hal_espressif
          - hal_ethos_u
          - hal_gigadevice
          - hal_intel
          - hal_microchip
          - hal_nuvoton
          - hal_openisa
          - hal_quicklogic
          - hal_realtek
          - hal_sifli
          - hal_tdk
          - hal_telink
          - hal_ti
          - hal_wurthelektronik
          - hal_xtensa
          # libraries the port never enables
          - acpica
          - cmsis-dsp
          - cmsis-nn
          - dhara
          - liblc3
          - libmctp
          - libsbc
          - lora-basics-modem
          - loramac-node
          - mipi-sys-t
          - mldsa-native
          - net-tools
          - openthread
          - percepio
          - reqmgmt
          - uoscore-uedhoc
          - zephyr-xenlib
