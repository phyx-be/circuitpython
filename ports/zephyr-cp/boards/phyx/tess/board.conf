# CIRCUITPY on the SD card
CONFIG_DISK_ACCESS=y
CONFIG_SDHC=y

# The boot mode in the RTC (tess-zephyr): RunMode.UF2 and the 1200 baud
# touch reset into MCUboot's UF2 drive
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# CIRCUITPY over USB in 32 KiB pieces: multi-block writes to the SD card,
# instead of two sectors at a time
CONFIG_USBD_MSC_SCSI_BUFFER_SIZE=32768

# WiFi through the ESP32-C3 (ESP-Hosted-MCU over SPI0, tess-zephyr's board)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y

CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="circuitpython"

CONFIG_MBEDTLS=y

# BLE implies the p256-m secp256r1 driver, with which tf-psa-crypto rejects the
# partly accelerated curves TLS wants (as on frdm_rw612)
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n

# Zephyr's malloc arena (TLS, BLE): with the MMU its default is 16 KiB, less
# than one TLS session's buffers; the VM heap takes the rest of the DRAM
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576

# TLS 1.3 next to 1.2 (the flash is the SD card's, with room to spare)
CONFIG_ZCP_MBEDTLS_TLS1_3=y

# The Touch Display 2 (shield rpi_touch_display_2): board.DISPLAY from the
# chosen zephyr,display, its GT911 touch screen for zephyr_input
CONFIG_DISPLAY=y
CONFIG_INPUT=y
